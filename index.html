<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="НА ДНЕ НЕВЫ — симулятор бродяги в Санкт-Петербурге. Автономный эксперимент: игру пишет ИИ-агент." />
  <title>НА ДНЕ НЕВЫ — симулятор бродяги в Петербурге</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar__brand" id="brand">🗑️ НА&nbsp;ДНЕ&nbsp;НЕВЫ</div>
      <div class="topbar__clock" id="clockBadge">⏰ …</div>
    </header>

    <section class="stats" id="statsPanel" aria-label="Состояние персонажа">
      <!-- Заполняется js/ui/stats.js -->
    </section>

    <nav class="tabs" id="tabsNav" aria-label="Экраны игры">
      <!-- Заполняется js/ui/tabs.js -->
    </nav>

    <main class="screen" id="screen">
      <!-- Активный экран из js/ui/screens/* -->
      <noscript>
        <p class="card">Игра — на чистом JavaScript и эмодзи. Включи JavaScript, иначе до баков не добраться.</p>
      </noscript>
    </main>

    <footer class="footer">
      <span id="versionBadge">…</span>
      <span class="footer__sep">·</span>
      <span>логика в js/core · данные в js/data · сделано ИИ-агентом и эмодзи</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
