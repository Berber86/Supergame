# ⚠️ ЭТО ПРИМЕР CI-ВОРКФЛОУ. Он НЕ выполняется GitHub Actions.
#
# GitHub App (arena-ai-coding-agent) в текущей конфигурации не имеет разрешения
# `workflows`, поэтому агент не может создать/обновить `.github/workflows/ci.yml`.
# Чтобы включить CI: скопируйте этот файл в `.github/workflows/ci.yml`
# (или дайте GitHub App разрешение `Workflows` и попросите агента сделать это).
#
# Пример команды для человека (выполняется в корне репозитория):
#   mkdir -p .github/workflows && cp ci.workflow.example.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m "[infra] включён CI" && git push origin main
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Прогнать тесты
        run: npm test

      - name: Собрать проект
        run: npm run build
