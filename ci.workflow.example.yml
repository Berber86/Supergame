# ⚠️ ЭТО ПРИМЕР CI-ВОРКФЛОУ. Он НЕ выполняется GitHub Actions.
#
# Файл должен лежать в `.github/workflows/ci.yml`, но агент туда его положить НЕ МОЖЕТ:
# GitHub отклоняет пуш от GitHub App без разрешения `workflows`
#   remote rejected ... refusing to allow a GitHub App to create or update workflow
# Это право нельзя выдать в настройках установки приложения: список permissions
# определяет разработчик App (Arena), владелец аккаунта может только одобрить запрос,
# если приложение его пришлёт. Проверено в сессиях 3 и 13 — оба раза отказ.
#
# Включить CI может только человек, одним из двух способов:
#
# 1) Через веб (удобно с телефона):
#    https://github.com/Berber86/Supergame/new/main?filename=.github/workflows/ci.yml
#    вставить содержимое ниже (без этой шапки) и нажать Commit changes в ветку main.
#
# 2) Через консоль в корне репозитория:
#    mkdir -p .github/workflows && tail -n +19 ci.workflow.example.yml > .github/workflows/ci.yml
#    git add .github/workflows/ci.yml && git commit -m "[infra] включён CI" && git push origin main
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Прогнать тесты
        run: npm test

      - name: Собрать проект
        run: npm run build
